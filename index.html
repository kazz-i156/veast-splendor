<script>
"use strict";
/* =========================================================
   VEAST Splendor  — single-file side-scrolling shooter
   ========================================================= */
const W = 960, H = 540;
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const TAU = Math.PI * 2;
const BOSS_TIME = 80;            // 秒：ボス出現タイミング
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

/* ---------- Canvas / resize ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

/* ---------- Audio (WebAudio, 素材ファイル不要) ---------- */
let ac = null, muted = false, noiseBuf = null, lastExp = 0;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function tone(f, dur, type, vol, slide) {
  if (!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + dur);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  o.connect(g).connect(ac.destination); o.start(n); o.stop(n + dur);
}
function noise(dur, vol, freq) {
  if (!ac || muted) return;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), n = ac.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq || 1200;
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(n); s.stop(n + dur);
}
function sfx(k) {
  if (k === 'exp') { const n = performance.now(); if (n - lastExp < 45) return; lastExp = n; noise(0.35, 0.25, 900); }
  else if (k === 'big') { noise(1.2, 0.5, 600); tone(90, 1.0, 'sawtooth', 0.15, 30); }
  else if (k === 'hit') { tone(220, 0.35, 'sawtooth', 0.2, 50); noise(0.3, 0.3, 2000); }
  else if (k === 'item') { tone(660, 0.12, 'square', 0.08, 1320); setTimeout(() => tone(990, 0.15, 'square', 0.08, 1760), 80); }
  else if (k === 'burst') { noise(0.9, 0.5, 3000); tone(120, 0.9, 'sawtooth', 0.2, 900); }
  else if (k === 'warn') { tone(440, 0.25, 'square', 0.1); setTimeout(() => tone(440, 0.25, 'square', 0.1), 400); }
  else if (k === 'start') { tone(440, 0.1, 'square', 0.08, 880); setTimeout(() => tone(880, 0.25, 'square', 0.08, 1760), 100); }
}

/* ---------- BGM（オリジナル曲・WebAudioでその場で合成） ---------- */
// 記法: 1トークン=8分音符（drums/bass/arp は自動生成で16分刻み）。"-"=前の音を伸ばす "."=休符
const SONGS = {
  stage: { // 道中曲「Steel Horizon」 Aマイナー
    bpm: 148, loop: true, drums: 'stage', bass: 'pump', arp: true,
    chords: ['Am', 'F', 'G', 'Em', 'Am', 'F', 'G', 'E', 'F', 'G', 'Em', 'Am', 'Dm', 'G', 'E', 'E'],
    lead: [
      'E5 - A5 - B5 C6 B5 A5', 'C6 - - A5 F5 - A5 C6', 'D6 - - C6 B5 - G5 B5', 'B5 - - G5 E5 - - -',
      'E5 - A5 - B5 C6 D6 E6', 'F6 - E6 - C6 - A5 -', 'B5 - D6 - G6 - F6 E6', 'E6 - - - D6 - B5 G#5',
      'A5 - C6 - F6 - E6 -', 'D6 - - B5 G5 - B5 D6', 'E6 - D6 - B5 - G5 -', 'A5 - - - C6 - E6 -',
      'F6 - E6 - D6 - A5 -', 'B5 - C6 - D6 - G6 -', 'G#5 - B5 - E6 - G#6 -', 'B6 - - - - - . .',
    ],
  },
  boss: { // ボス曲「Grand Veast」 Eフリジアン
    bpm: 168, loop: true, drums: 'boss', bass: 'drive', arp: false,
    chords: ['Em', 'F', 'Em', 'D', 'C', 'B', 'Em', 'F'],
    lead: [
      'E5 - B4 E5 G5 - F#5 E5', 'F5 - - C5 F5 A5 G5 F5', 'E5 - B4 E5 G5 - B5 -', 'A5 - F#5 - D5 - F#5 A5',
      'G5 - E5 - C6 - B5 A5', 'B5 - - D#6 - - F#6 -', 'E6 - D6 B5 G5 - E5 -', 'F5 - G5 - F5 E5 D#5 -',
    ],
  },
  title: { // タイトル：静かなアルペジオ
    bpm: 96, loop: true, drums: null, bass: 'long', arp: true,
    chords: ['Am', 'F', 'C', 'G'],
    lead: ['. . . . . . . .', 'E5 - - - D5 - C5 -', '. . . . . . . .', 'D5 - - - B4 - - -'],
  },
  clear: { // ボス撃破ファンファーレ
    bpm: 150, loop: false, drums: null, bass: 'long', arp: false,
    chords: ['C', 'C', 'F', 'G', 'C'],
    lead: ['C5 E5 G5 C6 - - G5 C6', 'E6 - - - - - . .', 'F5 A5 C6 F6 - - E6 F6', 'G6 - - - F6 - D6 -', 'E6 - - - - - - -'],
  },
  over: { // ゲームオーバー
    bpm: 84, loop: false, drums: null, bass: 'long', arp: false,
    chords: ['Am', 'Dm', 'E', 'Am'],
    lead: ['E5 - - - C5 - - -', 'D5 - - - A4 - - -', 'G#4 - - - B4 - - -', 'A4 - - - - - - -'],
  },
};
const CHORDS = {
  Am: ['A3', 'C4', 'E4'], F: ['F3', 'A3', 'C4'], G: ['G3', 'B3', 'D4'], Em: ['E3', 'G3', 'B3'], E: ['E3', 'G#3', 'B3'],
  Dm: ['D3', 'F3', 'A3'], C: ['C3', 'E3', 'G3'], D: ['D3', 'F#3', 'A3'], B: ['B2', 'D#3', 'F#3'],
};
const DRUMS = { // k=キック s=スネア h=ハット（16分×16）
  stage: { k: 'x.......x.x.....', s: '....x.......x...', h: '..x...x...x...x.' },
  boss: { k: 'x...x...x...x..x', s: '....x.......x...', h: 'xxxxxxxxxxxxxxxx' },
  fill: { k: 'x.......x.......', s: '....x...xxxxxxxx', h: '..x...x.........' },
};
function midi(n) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(n);
  return { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function compileSong(s) {
  const bars = s.chords.length, steps = bars * 16, ev = Array.from({ length: steps }, () => []);
  // メロディ
  const toks = s.lead.join(' ').split(/\s+/);
  for (let i = 0; i < toks.length; i++) {
    if (toks[i] === '-' || toks[i] === '.') continue;
    let len = 1; while (toks[i + len] === '-') len++;
    ev[i * 2].push({ i: 'lead', m: midi(toks[i]), d: len * 2 });
  }
  for (let b = 0; b < bars; b++) {
    const ch = CHORDS[s.chords[b]].map(midi), r = ch[0] - 12, o = b * 16;
    // ベース
    if (s.bass === 'pump') [0, 0, 12, 0, 0, 12, 0, 12].forEach((d, k) => ev[o + k * 2].push({ i: 'bass', m: r + d, d: 1.6 }));
    else if (s.bass === 'drive') [0, 0, 12, 0, 0, 12, 0, 7, 0, 0, 12, 0, 1, 12, 10, 7].forEach((d, k) => ev[o + k].push({ i: 'bass', m: r + d, d: 0.9 }));
    else ev[o].push({ i: 'bass', m: r, d: 15 });
    // アルペジオ
    if (s.arp) {
      const a = [ch[0], ch[1], ch[2], ch[0] + 12, ch[2], ch[1], ch[0] + 12, ch[2]];
      for (let k = 0; k < 16; k++) ev[o + k].push({ i: 'arp', m: a[k % 8] + 12, d: 0.9 });
    }
    // ドラム
    if (s.drums) {
      const p = DRUMS[s.drums === 'stage' && b === bars - 1 ? 'fill' : s.drums];
      for (let k = 0; k < 16; k++) for (const d of 'ksh') if (p[d][k] === 'x') ev[o + k].push({ i: d });
    }
  }
  return { ev, steps, spb: 60 / s.bpm / 4, loop: s.loop };
}
const SONG_DATA = {};
for (const k in SONGS) SONG_DATA[k] = compileSong(SONGS[k]);

let musicBus = null, curSong = null, songStep = 0, nextNoteT = 0, musicVol = -1;
function voice(type, f, t, dur, vol, cutoff, det) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (det) o.detune.value = det;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(vol * 0.55, t + Math.min(dur, 0.25));
  g.gain.setValueAtTime(vol * 0.55, t + dur);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.08);
  let node = o;
  if (cutoff) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cutoff; o.connect(fl); node = fl; }
  node.connect(g).connect(musicBus); o.start(t); o.stop(t + dur + 0.1);
}
function drum(k, t) {
  if (k === 'k') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(musicBus); o.start(t); o.stop(t + 0.2);
    return;
  }
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), dur = k === 's' ? 0.16 : 0.035;
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = k === 's' ? 1500 : 7000;
  g.gain.setValueAtTime(k === 's' ? 0.22 : 0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(musicBus); s.start(t, Math.random() * 0.5); s.stop(t + dur);
  if (k === 's') voice('triangle', 190, t, 0.03, 0.12);
}
function playSong(name) {
  if (curSong === name) return;
  curSong = name; songStep = 0; nextNoteT = ac ? ac.currentTime + 0.06 : 0;
}
function musicTick() {
  if (!ac || !musicBus || !curSong || ac.state !== 'running') return;
  const s = SONG_DATA[curSong];
  if (nextNoteT < ac.currentTime - 0.2) nextNoteT = ac.currentTime + 0.05; // タブ復帰などで遅れたら追いつく
  while (nextNoteT < ac.currentTime + 0.15) {
    if (songStep >= s.steps) { if (!s.loop) return; songStep = 0; }
    for (const e of s.ev[songStep]) {
      const t = nextNoteT;
      if (e.i === 'lead') {
        const d = e.d * s.spb * 0.95, f = hz(e.m);
        voice('square', f, t, d, 0.045, 3200, -6); voice('sawtooth', f, t, d, 0.035, 2600, 7);
      } else if (e.i === 'bass') voice('sawtooth', hz(e.m), t, e.d * s.spb, 0.1, 700);
      else if (e.i === 'arp') voice('square', hz(e.m), t, e.d * s.spb, 0.018, 1800);
      else drum(e.i, t);
    }
    songStep++; nextNoteT += s.spb;
  }
}
setInterval(musicTick, 25);
function updateMusic() {
  if (!ac) return;
  if (!musicBus) { musicBus = ac.createGain(); musicBus.gain.value = 0; musicBus.connect(ac.destination); }
  playSong(state === 'title' || state === 'option' ? 'title' : state === 'over' ? 'over' : state === 'clear' || clearT > 0 ? 'clear' : bossSpawned ? 'boss' : 'stage');
  const v = muted ? 0 : paused ? 0.25 : 0.55;
  if (v !== musicVol) { musicVol = v; musicBus.gain.setTargetAtTime(v, ac.currentTime, 0.08); }
}
document.addEventListener('visibilitychange', () => { if (ac) { if (document.hidden) ac.suspend(); else if (state !== 'play') ac.resume(); } });

/* ---------- State ---------- */
let state = 'title', stateT = 0, paused = false, usedTouch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
let P, pb, eb, enemies, parts, items, t, spawnT, score, boss, bossSpawned, loop = 1, flash, shake, msg, clearT;
let hi = 0;
try { hi = +localStorage.getItem('veast_hi') || 0; } catch (e) {}
function saveHi() { if (score > hi) { hi = score; try { localStorage.setItem('veast_hi', hi); } catch (e) {} } }

function resetField() {
  pb = []; eb = []; enemies = []; parts = []; items = [];
  t = 0; spawnT = 1.5; boss = null; bossSpawned = false; flash = 0; shake = 0; msg = null; clearT = 0;
}
let startStage = 1;                            // OPTIONで選んだ開始ステージ(1〜3)
try { startStage = Math.min(3, Math.max(1, +localStorage.getItem('veast_stage') || 1)); } catch (e) {}
loop = startStage;                             // タイトル背景も開始ステージに合わせる
function startGame() {
  loop = startStage; score = 0; resetField();
  P = { x: 150, y: H / 2, vy: 0, thrust: 0, upT: 0, hp: 5, maxhp: 5, inv: 2, lvl: 1, fire: 0, burst: 0 };
  setState('play'); msg = { text: 'STAGE ' + loop + '  ' + STAGES[stageIdx()].name, t: 2.5 }; sfx('start');
}
function continueGame() {                      // CONTINUE：やられたステージの最初から（スコアは0から）
  score = 0; resetField();
  P = { x: 150, y: H / 2, vy: 0, thrust: 0, upT: 0, hp: 5, maxhp: 5, inv: 2, lvl: 1, fire: 0, burst: 0 };
  setState('play'); msg = { text: 'STAGE ' + loop + '  ' + STAGES[stageIdx()].name, t: 2.5 }; sfx('start');
}
function mainMenu() { resetField(); loop = startStage; titleSel = 0; setState('title'); sfx('start'); }
function nextLoop() {
  loop++; resetField();
  P.x = 150; P.y = H / 2; P.vy = 0; P.thrust = 0; P.upT = 0; P.hp = P.maxhp; P.inv = 2;
  setState('play'); msg = { text: 'STAGE ' + loop + '  ' + STAGES[stageIdx()].name, t: 2.5 }; sfx('start');
}
function setState(s) { state = s; stateT = 0; paused = false; }
const GRAVITY = 320, MAX_FALL = 210; // 自機にかかる重力(px/s²)と最大落下速度(px/s)
const diff = () => (1 + t / 70) * (1 + (loop - 1) * 0.35);

/* ---------- Input ---------- */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  initAudio();
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'play') {
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
    else if (e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') triggerBurst();
  } else if (state === 'title') titleKey(e.code);
  else if (state === 'option') optionKey(e.code);
  else if (state === 'over') overKey(e.code);
  else if (['Enter', 'Space', 'KeyZ'].includes(e.code)) advance();
});
addEventListener('keyup', e => { keys[e.code] = false; });
// LINE などのアプリ内ブラウザ(WebView)は、画面タップのたびに window の blur を発火することがある。
// そのためタッチ操作中は blur でポーズせず、本当に画面が隠れたとき(visibilitychange / pagehide)だけポーズする。
const autoPause = () => { if (state === 'play') paused = true; };
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (!usedTouch) autoPause();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
addEventListener('pagehide', autoPause);
addEventListener('contextmenu', e => e.preventDefault());

const burstBtn = { x: W - 82, y: H - 82, r: 50 };
const pauseBtn = { x: W - 40, y: 40, r: 26 };
let drag = null;
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType === 'touch') usedTouch = true;
  const p = toLogical(e);
  if (state === 'title') { titleTap(p); return; }
  if (state === 'option') { optionTap(p); return; }
  if (state === 'over') { overTap(p); return; }
  if (state !== 'play') { advance(); return; }
  if (paused) { paused = false; return; }
  if (usedTouch && dist2(p, pauseBtn) < (pauseBtn.r + 14) ** 2) { paused = true; return; }
  if (usedTouch && dist2(p, burstBtn) < (burstBtn.r + 14) ** 2) { triggerBurst(); return; }
  if (!drag) drag = { id: e.pointerId, x: p.x, y: p.y };
}, { passive: false });
addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || state !== 'play' || paused) return;
  const p = toLogical(e);
  P.x += (p.x - drag.x) * 1.3; P.y += (p.y - drag.y) * 1.3;
  if (Math.abs(p.y - drag.y) > 0.5) P.vy = 0; // 指で上下に動かしたら落下速度をリセット
  if (p.y - drag.y < -0.5) P.upT = 0.12;       // 上方向へのドラッグ＝上昇噴射
  drag.x = p.x; drag.y = p.y;
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

/* ---------- Title menu / OPTION ---------- */
// タイトル：START / OPTION を選択。OPTION：開始ステージを選んで BACK で戻る
const titleBtns = [{ id: 'start', label: 'START', x: W / 2 - 110, y: 345, w: 190, h: 52 }, { id: 'option', label: 'OPTION', x: W / 2 + 110, y: 345, w: 190, h: 52 }];
const optBtns = {
  prev: { x: W / 2 - 230, y: 260, w: 70, h: 70 }, next: { x: W / 2 + 230, y: 260, w: 70, h: 70 },
  back: { x: W / 2, y: 430, w: 200, h: 52 },
};
let titleSel = 0, optSel = 0;                   // optSel: 0=開始ステージ 1=BACK
const inBtn = (p, b) => Math.abs(p.x - b.x) < b.w / 2 && Math.abs(p.y - b.y) < b.h / 2;
function setStartStage(n) {
  startStage = ((n - 1 + 3) % 3) + 1; loop = startStage; // 背景も選んだステージのプレビューに切り替える
  try { localStorage.setItem('veast_stage', startStage); } catch (e) {}
  sfx('item');
}
function openOption() { setState('option'); optSel = 0; loop = startStage; sfx('start'); }
function closeOption() { setState('title'); titleSel = 1; sfx('start'); }
function titleKey(code) {
  if (stateT < 0.3) return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'].includes(code)) { titleSel ^= 1; sfx('item'); }
  else if (['Enter', 'Space', 'KeyZ'].includes(code)) titleSel ? openOption() : startGame();
}
function optionKey(code) {
  if (stateT < 0.2) return;
  if (['ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'].includes(code)) optSel ^= 1;
  else if (optSel === 0 && ['ArrowLeft', 'KeyA'].includes(code)) setStartStage(startStage - 1);
  else if (optSel === 0 && ['ArrowRight', 'KeyD'].includes(code)) setStartStage(startStage + 1);
  else if (code === 'Escape' || code === 'Backspace' || (optSel === 1 && ['Enter', 'Space', 'KeyZ'].includes(code))) closeOption();
  else if (optSel === 0 && ['Enter', 'Space', 'KeyZ'].includes(code)) optSel = 1;
}
function titleTap(p) {
  if (stateT < 0.3) return;
  if (inBtn(p, titleBtns[0])) startGame();
  else if (inBtn(p, titleBtns[1])) openOption();
}
function optionTap(p) {
  if (stateT < 0.2) return;
  if (inBtn(p, optBtns.prev)) { optSel = 0; setStartStage(startStage - 1); }
  else if (inBtn(p, optBtns.next) || inBtn(p, { x: W / 2, y: 260, w: 340, h: 90 })) { optSel = 0; setStartStage(startStage + 1); }
  else if (inBtn(p, optBtns.back)) closeOption();
}

// ゲームオーバー：CONTINUE / MAIN MENU（直前の操作で誤って押さないよう少し待ってから受け付ける）
const overBtns = [{ id: 'cont', label: 'CONTINUE', x: W / 2 - 125, y: 410, w: 220, h: 52 }, { id: 'menu', label: 'MAIN MENU', x: W / 2 + 125, y: 410, w: 220, h: 52 }];
let overSel = 0;
function overKey(code) {
  if (stateT < 1) return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'].includes(code)) { overSel ^= 1; sfx('item'); }
  else if (['Enter', 'Space', 'KeyZ'].includes(code)) overSel ? mainMenu() : continueGame();
  else if (code === 'Escape') mainMenu();
}
function overTap(p) {
  if (stateT < 1) return;
  if (inBtn(p, overBtns[0])) continueGame();
  else if (inBtn(p, overBtns[1])) mainMenu();
}

function advance() {
  if (stateT < 0.7) return;
  if (state === 'clear') nextLoop();
}

/* ---------- Spawning ---------- */
function spawnDroneGroup() {
  const by = rand(80, H - 80), n = 4 + Math.floor(Math.random() * 3), amp = rand(30, 90);
  for (let i = 0; i < n; i++)
    enemies.push({ type: 'drone', x: W + 30 + i * 46, y: by, by, amp, ph: i * 0.6, vx: -rand(170, 210),
      hp: 2, r: 16, score: 100, age: 0, flash: 0 });
}
function spawnGunner() {
  const y = rand(70, H - 70);
  enemies.push({ type: 'gunner', x: W + 40, y, tx: rand(620, 820), hp: 7, r: 22, score: 300, age: 0, flash: 0, cd: 1 });
}
function spawnHeavy() {
  enemies.push({ type: 'heavy', x: W + 60, y: rand(110, H - 110), vx: -55, hp: 24, r: 34, score: 800, age: 0, flash: 0, cd: 1.5 });
}
function spawnBoss() {
  bossSpawned = true;
  const hp = Math.round(420 * (1 + (loop - 1) * 0.5));
  boss = { type: 'boss', x: W + 160, y: H / 2, r: 60, hp, maxhp: hp, score: 20000, age: 0, flash: 0,
    phase: 0, pt: 0, cd: 0, ang: 0 };
  enemies.push(boss); msg = { text: 'WARNING', t: 3, warn: true }; sfx('warn');
}
function spawnLogic(dt) {
  if (bossSpawned) return;
  if (t >= BOSS_TIME) { if (enemies.length === 0 || t > BOSS_TIME + 5) spawnBoss(); return; }
  spawnT -= dt;
  if (spawnT <= 0) {
    const r = Math.random(), d = diff();
    if (t > 20 && r < 0.1 * d) spawnHeavy();
    else if (t > 8 && r < 0.42) spawnGunner();
    else spawnDroneGroup();
    spawnT = rand(1.2, 2.1) / d;
  }
}

/* ---------- Shots ---------- */
function eShot(x, y, vx, vy, big) { eb.push({ x, y, vx, vy, r: big ? 8 : 5 }); }
function aimShot(x, y, sp, off = 0) {
  const a = Math.atan2(P.y - y, P.x - x) + off;
  eShot(x, y, Math.cos(a) * sp, Math.sin(a) * sp);
}
function fan(x, y, n, spread, sp) {
  for (let i = 0; i < n; i++) aimShot(x, y, sp, n === 1 ? 0 : -spread / 2 + spread * i / (n - 1));
}
function playerFire() {
  const x = P.x + 42, y = P.y + 1, s = 900;
  const add = (dy, a) => pb.push({ x, y: y + dy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 6 });
  if (P.lvl === 1) add(0, 0);
  else if (P.lvl === 2) { add(-6, 0); add(6, 0); }
  else { add(-6, 0); add(6, 0); add(0, -0.13); add(0, 0.13); }
}

/* ---------- Damage / effects ---------- */
function explode(x, y, size, col) {
  const n = Math.round(10 * size);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(60, 260) * size;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7,
      size: rand(2, 4) * Math.sqrt(size), c: col || (Math.random() < 0.5 ? '#ffcc33' : '#ff6a3d') });
  }
  parts.push({ ring: true, x, y, life: 0.4, max: 0.4, size: 30 * size, c: '#fff' });
}
function damage(e, d) {
  if (e.dead) return;
  e.hp -= d; e.flash = 0.06;
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  e.dead = true; score += e.score * loop;
  const charge = { drone: 3, gunner: 7, heavy: 14, boss: 0 }[e.type];
  P.burst = Math.min(100, P.burst + charge);
  if (e.type === 'boss') {
    boss = null; clearT = 3.2; eb.length = 0;
    for (let i = 0; i < 12; i++) setTimeout(() => { if (state === 'play') { explode(e.x + rand(-60, 60), e.y + rand(-60, 60), 1.6); sfx('exp'); } }, i * 120);
    explode(e.x, e.y, 3, '#fff'); sfx('big'); shake = 1; flash = 0.8;
    return;
  }
  explode(e.x, e.y, e.type === 'heavy' ? 2 : e.type === 'gunner' ? 1.3 : 0.9);
  sfx(e.type === 'heavy' ? 'big' : 'exp');
  if (e.type === 'heavy') shake = Math.max(shake, 0.3);
  const r = Math.random();
  if (e.type === 'heavy' || r < 0.05) items.push({ type: 'P', x: e.x, y: e.y, age: 0 });
  else if (r < 0.08) items.push({ type: 'H', x: e.x, y: e.y, age: 0 });
}
function hurtPlayer() {
  if (P.inv > 0 || clearT > 0) return;
  P.hp--; P.inv = 2; P.lvl = Math.max(1, P.lvl - 1);
  explode(P.x, P.y, 1.2, '#4cf'); sfx('hit'); shake = 0.5; flash = 0.3;
  if (P.hp <= 0) { explode(P.x, P.y, 3, '#4cf'); sfx('big'); saveHi(); setState('over'); overSel = 0; }
}
function triggerBurst() {
  if (state !== 'play' || paused || P.burst < 100) return;
  P.burst = 0; flash = 1; shake = 0.6; P.inv = Math.max(P.inv, 1.2);
  for (const b of eb) parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.3, max: 0.3, size: 5, c: '#9ff' });
  eb.length = 0;
  for (const e of enemies) damage(e, e.type === 'boss' ? 50 : 30);
  parts.push({ ring: true, x: P.x, y: P.y, life: 0.7, max: 0.7, size: 700, c: '#7ff' });
  sfx('burst');
}

/* ---------- Update ---------- */
function updEnemy(e, dt) {
  e.age += dt; e.flash = Math.max(0, e.flash - dt);
  const d = diff();
  switch (e.type) {
    case 'drone':
      e.x += e.vx * dt; e.y = e.by + Math.sin(e.age * 3 + e.ph) * e.amp;
      if (d > 1.5 && e.x < W - 40 && Math.random() < dt * 0.12 * d) aimShot(e.x, e.y, 210);
      break;
    case 'gunner':
      if (e.age < 7) e.x += (e.tx - e.x) * Math.min(1, dt * 2.5);
      else e.x += 240 * dt;
      e.cd -= dt;
      if (e.age > 1 && e.age < 7 && e.cd <= 0) { fan(e.x - 20, e.y, d > 1.8 ? 3 : 1, 0.35, 240); e.cd = 1.5 / d; }
      break;
    case 'heavy':
      e.x += e.vx * dt; e.y += Math.sin(e.age * 1.2) * 30 * dt;
      e.cd -= dt;
      if (e.cd <= 0 && e.x < W - 40) { fan(e.x - 30, e.y, 5, 1.0, 170); e.cd = 2.3 / d; }
      break;
    case 'boss': updBoss(e, dt); break;
  }
}
function updBoss(e, dt) {
  if (e.age < 2.8) { e.x += (760 - e.x) * dt * 1.4; return; }
  const k = e.age - 2.8;
  e.y = H / 2 + Math.sin(k * 0.7) * 150;
  e.x = 760 + Math.sin(k * 0.45) * 50;
  e.pt += dt;
  if (e.pt > 6) { e.pt = 0; e.phase = (e.phase + 1) % 3; e.cd = 0.8; }
  const rage = (e.hp < e.maxhp * 0.5 ? 1.4 : 1) * (1 + (loop - 1) * 0.2);
  e.cd -= dt;
  if (e.cd > 0) return;
  if (e.phase === 0) { fan(e.x - 50, e.y, rage > 1.2 ? 7 : 5, 0.7, 250); e.cd = 0.95 / rage; }
  else if (e.phase === 1) {
    e.ang += 0.41;
    for (let i = 0; i < 3; i++) { const a = e.ang + i * TAU / 3; eShot(e.x - 20, e.y, Math.cos(a) * 165, Math.sin(a) * 165); }
    e.cd = 0.12 / rage;
  } else {
    aimShot(e.x - 60, e.y - 42, 330); aimShot(e.x - 60, e.y + 42, 330); e.cd = 0.24 / rage;
  }
}

function update(dt) {
  stateT += dt;
  updateBG(dt);
  for (const p of parts) { p.life -= dt; if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; } }
  parts = parts.filter(p => p.life > 0);
  flash = Math.max(0, flash - dt * 2); shake = Math.max(0, shake - dt);
  if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
  if (state !== 'play' || paused) return;

  t += dt;
  // player
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.KeyA) mx--;
  if (keys.ArrowRight || keys.KeyD) mx++;
  if (keys.ArrowUp || keys.KeyW) my--;
  if (keys.ArrowDown || keys.KeyS) my++;
  if (mx && my) { mx *= 0.7071; my *= 0.7071; }
  const sp = keys.KeyC ? 170 : 340; // Cキーで低速移動
  P.x = clamp(P.x + mx * sp * dt, 30, W - 70);
  // 緩い重力：上下の入力がない間はゆっくり沈んでいく
  if (my < 0) P.upT = 0.12;
  P.upT = Math.max(0, (P.upT || 0) - dt);
  P.thrust += ((P.upT > 0 ? 1 : 0) - P.thrust) * Math.min(1, dt * 12); // 噴射炎の大きさ(0〜1)をなめらかに変化
  if (my) P.vy = 0;
  else P.vy = Math.min(P.vy + GRAVITY * dt, MAX_FALL);
  P.y += (my * sp + P.vy) * dt;
  if (P.y > H - 30) { P.y = H - 30; P.vy = 0; }
  if (P.y < 34) P.y = 34;
  P.inv = Math.max(0, P.inv - dt);
  P.fire -= dt;
  if (P.fire <= 0 && clearT <= 0) { playerFire(); P.fire = 0.085; }

  spawnLogic(dt);

  for (const b of pb) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const b of eb) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const e of enemies) updEnemy(e, dt);
  for (const it of items) { it.age += dt; it.x -= 80 * dt; it.y += Math.sin(it.age * 3) * 40 * dt; }

  // player bullets vs enemies
  for (const b of pb) {
    for (const e of enemies) {
      if (e.dead || e.x > W + 20) continue;
      if (dist2(b, e) < (b.r + e.r) ** 2) { damage(e, 1); b.dead = true; parts.push({ x: b.x, y: b.y, vx: rand(-80, 0), vy: rand(-60, 60), life: 0.15, max: 0.15, size: 3, c: '#fff' }); break; }
    }
  }
  // enemy bullets vs player (当たり判定は胸の小さなコアのみ)
  for (const b of eb) if (dist2(b, P) < (b.r + 5) ** 2) { b.dead = true; hurtPlayer(); }
  for (const e of enemies) if (!e.dead && dist2(e, P) < (e.r * 0.8 + 8) ** 2) { hurtPlayer(); if (e.type !== 'boss') damage(e, 5); }
  for (const it of items) if (dist2(it, P) < 30 * 30) {
    it.dead = true; sfx('item');
    if (it.type === 'P') { if (P.lvl < 3) P.lvl++; else score += 1000 * loop; msg = { text: P.lvl < 3 ? 'POWER UP' : 'MAX POWER', t: 1 }; }
    else { P.hp = Math.min(P.maxhp, P.hp + 1); msg = { text: 'REPAIR', t: 1 }; }
  }

  pb = pb.filter(b => !b.dead && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  eb = eb.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  enemies = enemies.filter(e => !e.dead && e.x > -100 && !(e.x > W + 120 && e.age > 3));
  items = items.filter(it => !it.dead && it.x > -20);

  if (clearT > 0) { clearT -= dt; if (clearT <= 0) { saveHi(); setState('clear'); } }
  if (state === 'play' && score > hi) hi = score;
}

/* ---------- Background ---------- */
// ステージ構成：1面=夜の都市 / 2面=昼の森林 / 3面=昼の砂漠。4面以降はこの3つを繰り返す
const STAGES = [
  { name: 'NIGHT CITY', jp: '夜の都市', day: false },
  { name: 'FOREST', jp: '昼の森林', day: true },
  { name: 'DESERT', jp: '昼の砂漠', day: true },
];
const stageIdx = () => (loop - 1) % STAGES.length;
const isDay = () => STAGES[stageIdx()].day;

// 1面：夜の都市
const stars = [];
for (let i = 0; i < 110; i++) stars.push({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1) });
function makeCity(n, minH, maxH) {
  const a = []; let x = 0;
  while (x < W + 200) { const w = rand(30, 80); a.push({ x, w, h: rand(minH, maxH), lit: Math.random() }); x += w + rand(0, 10); }
  return { b: a, off: 0, len: x };
}
const cityFar = makeCity(0, 60, 160), cityNear = makeCity(0, 30, 100);

// 昼ステージ共通：雲
const clouds = [];
for (let i = 0; i < 7; i++) clouds.push({ x: rand(0, W + 200), y: rand(30, 220), s: rand(0.6, 1.4), z: rand(0.3, 1) });
// 稜線（山・砂丘）：周期 len で途切れずにつながる高さ関数
function makeRidge(len, base, waves) { return { off: 0, len, y: x => base + waves.reduce((s, [a, n, ph]) => s + a * Math.sin(x / len * TAU * n + ph), 0) }; }
// 2面：森林
const mtnFar = makeRidge(W, 300, [[40, 2, 0.3], [22, 5, 1.1], [10, 11, 2]]);
const forestMid = makeRidge(W, 390, [[14, 3, 0.7], [8, 8, 0.2]]);
function makeTrees(len, minS, maxS, gap) {
  const a = []; let x = 0;
  while (x < len) { const s = rand(minS, maxS); a.push({ x, s, k: Math.random() }); x += s * gap * rand(0.7, 1.3); }
  return { t: a, off: 0, len };
}
const treesMid = makeTrees(W * 1.25, 18, 30, 1.3), treesNear = makeTrees(W * 1.5, 34, 58, 1.6);
// 3面：砂漠
const mesas = (() => { const a = []; let x = 0; while (x < W * 1.5) { const w = rand(70, 180); a.push({ x, w, h: rand(50, 120), top: rand(0.55, 0.8) }); x += w + rand(60, 220); } return { m: a, off: 0, len: x }; })();
const duneFar = makeRidge(W, 400, [[18, 2, 0.5], [9, 5, 1.7]]);
const duneNear = makeRidge(W, 470, [[24, 1, 2.2], [12, 3, 0.4], [5, 7, 1]]);
const cacti = makeTrees(W * 1.5, 26, 46, 7);

let bgT = 0;
function updateBG(dt) {
  const v = state === 'play' && !paused ? 1 : 0.4;
  bgT += dt * v;
  for (const s of stars) { s.x -= s.z * 120 * dt * v; if (s.x < 0) { s.x += W; s.y = rand(0, H); } }
  for (const c of clouds) { c.x -= (10 + c.z * 30) * dt * v; if (c.x < -200) { c.x = W + rand(50, 200); c.y = rand(30, 220); } }
  const sc = (o, sp) => { o.off = (o.off + sp * dt * v) % o.len; };
  sc(cityFar, 25); sc(cityNear, 60);
  sc(mtnFar, 15); sc(forestMid, 40); sc(treesMid, 40); sc(treesNear, 110);
  sc(mesas, 18); sc(duneFar, 45); sc(duneNear, 100); sc(cacti, 100);
}
function drawCity(c, col, winCol) {
  ctx.fillStyle = col;
  for (let k = 0; k < 2; k++) for (const b of c.b) {
    const x = b.x - c.off + k * c.len;
    if (x > W || x + b.w < 0) continue;
    ctx.fillRect(x, H - b.h, b.w, b.h);
    if (winCol && b.lit > 0.4) {
      ctx.fillStyle = winCol;
      for (let wy = H - b.h + 10; wy < H - 8; wy += 14) for (let wx = x + 6; wx < x + b.w - 6; wx += 12)
        if (((wx * 7 + wy * 13) | 0) % 5 === 0) ctx.fillRect(wx, wy, 4, 5);
      ctx.fillStyle = col;
    }
  }
}
function drawRidge(r, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, r.y(x + r.off));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function sky(stops) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  stops.forEach(([p, c]) => g.addColorStop(p, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawSun(x, y, r, core, glow) {
  const g = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 3);
  g.addColorStop(0, glow); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, TAU); ctx.fill();
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function drawClouds(col) {
  ctx.fillStyle = col;
  for (const c of clouds) {
    ctx.beginPath();
    for (const [dx, dy, r] of [[0, 0, 26], [28, -10, 32], [60, 0, 24], [30, 8, 26]]) { ctx.moveTo(c.x + dx * c.s + r * c.s, c.y + dy * c.s); ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, TAU); }
    ctx.fill();
  }
}
function forEachLoop(o, list, fn) { for (let k = 0; k < 2; k++) for (const it of list) { const x = it.x - o.off + k * o.len; if (x > -100 && x < W + 100) fn(it, x); } }
function drawForest() {
  sky([[0, '#3a88cc'], [0.55, '#86bde4'], [1, '#bcd9ec']]);
  drawSun(800, 90, 34, '#fffbe0', 'rgba(255,250,210,0.55)');
  drawClouds('rgba(255,255,255,0.85)');
  drawRidge(mtnFar, '#8fb8c8');                                  // 遠景の山（青く霞む）
  drawRidge(forestMid, '#4f8f5a');                               // 中景の森の稜線
  forEachLoop(treesMid, treesMid.t, (t, x) => {                  // 中景の広葉樹
    const y = forestMid.y(x + forestMid.off);
    ctx.fillStyle = '#3f7d4a'; ctx.beginPath(); ctx.arc(x, y - t.s * 0.6, t.s, 0, TAU); ctx.arc(x + t.s * 0.7, y - t.s * 0.2, t.s * 0.75, 0, TAU); ctx.fill();
  });
  ctx.fillStyle = '#2f6a3a'; ctx.fillRect(0, H - 70, W, 70);     // 林床
  forEachLoop(treesNear, treesNear.t, (t, x) => {                // 近景の針葉樹
    const base = H - 30, h = t.s * 3.4;
    ctx.fillStyle = '#4a3020'; ctx.fillRect(x - t.s * 0.1, base - h * 0.25, t.s * 0.2, h * 0.3);
    ctx.fillStyle = t.k > 0.5 ? '#1f5a2c' : '#24653a';
    for (let i = 0; i < 3; i++) {
      const ty = base - h * 0.2 - i * h * 0.26, w = t.s * (1 - i * 0.22);
      ctx.beginPath(); ctx.moveTo(x - w, ty); ctx.lineTo(x, ty - h * 0.42); ctx.lineTo(x + w, ty); ctx.closePath(); ctx.fill();
    }
  });
  ctx.fillStyle = '#1d4a27'; ctx.fillRect(0, H - 30, W, 30);    // 手前の地面
}
function drawDesert() {
  sky([[0, '#2f74bc'], [0.5, '#7fb2da'], [0.8, '#e2c493'], [1, '#e0ad6c']]);
  drawSun(180, 110, 40, '#fffef2', 'rgba(255,240,180,0.6)');
  ctx.globalAlpha = 0.6; drawClouds('#ffffff'); ctx.globalAlpha = 1;
  forEachLoop(mesas, mesas.m, (m, x) => {                        // 遠景の岩山（メサ）
    const by = 410, ty = by - m.h, inset = m.w * (1 - m.top) / 2;
    ctx.fillStyle = '#d08a5a'; ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + inset, ty); ctx.lineTo(x + m.w - inset, ty); ctx.lineTo(x + m.w, by); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b8704a'; ctx.fillRect(x + inset, ty, m.w - inset * 2, 6);
  });
  drawRidge(duneFar, '#eac27e');                                 // 中景の砂丘
  drawRidge(duneNear, '#d9a253');                                // 近景の砂丘
  forEachLoop(cacti, cacti.t, (c, x) => {                        // サボテン
    const y = duneNear.y(x + duneNear.off) + 6, h = c.s * 1.6, w = c.s * 0.22;
    ctx.fillStyle = '#3f7a3a';
    ctx.fillRect(x - w / 2, y - h, w, h);
    ctx.fillRect(x - w * 2, y - h * 0.62, w * 1.6, w * 0.8); ctx.fillRect(x - w * 2, y - h * 0.9, w * 0.8, h * 0.3);
    ctx.fillRect(x + w * 0.4, y - h * 0.45, w * 1.6, w * 0.8); ctx.fillRect(x + w * 1.2, y - h * 0.75, w * 0.8, h * 0.32);
  });
  ctx.fillStyle = 'rgba(255,255,255,0.12)';                      // 陽炎のゆらぎ
  for (let i = 0; i < 4; i++) ctx.fillRect(0, 440 + i * 22 + Math.sin(bgT * 2 + i) * 3, W, 2);
}
function drawBG() {
  const s = stageIdx();
  if (s === 1) return drawForest();
  if (s === 2) return drawDesert();
  sky([[0, '#05060f'], [0.65, '#14123a'], [1, '#3a1a4a']]);
  for (const s of stars) { ctx.fillStyle = `rgba(200,220,255,${s.z})`; ctx.fillRect(s.x, s.y, s.z * 2.4, s.z * 2.4); }
  drawCity(cityFar, '#1b1840', 'rgba(255,200,120,0.25)');
  drawCity(cityNear, '#0c0b22', 'rgba(120,220,255,0.35)');
}

// メカ描画キット：多角形・金属グラデーション・発光
function poly(pts, col, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath();
  if (col) { ctx.fillStyle = col; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.8; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function line(pts, col, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function lg(x0, y0, x1, y1, ...cols) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  cols.forEach((c, i) => g.addColorStop(i / (cols.length - 1), c)); return g;
}
function glow(x, y, r, col, core) {
  const op = ctx.globalCompositeOperation; if (!isDay()) ctx.globalCompositeOperation = 'lighter'; // 昼は加算合成だと白飛びするので通常合成
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, core || '#fff'); g.addColorStop(0.25, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = op;
}
function flame(x, y, len, w, ang) {             // 噴射炎（後方へ）
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang || 0);
  const op = ctx.globalCompositeOperation; ctx.globalCompositeOperation = 'lighter';
  poly([0, -w, -len, 0, 0, w], lg(0, 0, -len, 0, 'rgba(120,230,255,0.95)', 'rgba(40,120,255,0.5)', 'rgba(40,80,255,0)'));
  poly([0, -w * 0.5, -len * 0.55, 0, 0, w * 0.5], lg(0, 0, -len * 0.55, 0, '#fff', 'rgba(170,250,255,0)'));
  ctx.globalCompositeOperation = op; ctx.restore();
}

  if (state === 'over') return;
  ctx.save(); ctx.translate(P.x, P.y); ctx.scale(1.25, 1.25);
  if (P.inv > 0 && Math.floor(P.inv * 20) % 2) ctx.globalAlpha = 0.35;
  const th = P.thrust || 0, fl = Math.random();

    // 背部の大型フィン
    poly([20, -64, 70, -112, 92, -108, 64, -60], H1(lg(0, -112, 0, -60, EC.p1, EC.p2)), EC.ln);
    poly([20, 64, 70, 112, 92, 108, 64, 60], H1(lg(0, 60, 0, 112, EC.p2, EC.a3)), EC.ln);
    line([30, -66, 76, -106], EC.red, 2); line([30, 66, 76, 106], EC.red, 2);
    // 肩キャノン
    for (const s of [-1, 1]) {
      poly([-82, s * 36, -40, s * 34, -40, s * 50, -82, s * 48], H1(lg(0, s * 34, 0, s * 50, EC.a1, EC.a3)), EC.ln);
      poly([-90, s * 33, -80, s * 33, -80, s * 51, -90, s * 51], H1(EC.a3), EC.ln);
      line([-78, s * 42, -46, s * 42], EC.red, 1.5);
      glow(-90, s * 42, 10 + pulse * 2, 'rgba(255,90,90,0.7)');
    }
    // 本体
    poly([-74, -40, -32, -72, 56, -80, 100, -42, 104, 0, 100, 42, 56, 80, -32, 72, -74, 40, -84, 0], H1(lg(0, -80, 0, 80, '#4b4170', EC.p2, '#1d1830')), EC.ln, 1.2);
    poly([-50, -28, -12, -52, 66, -54, 84, -20, 84, 20, 66, 54, -12, 52, -50, 28], H1(lg(0, -54, 0, 54, '#5d6680', EC.a2, EC.a3)), EC.ln);
    poly([-12, -52, 66, -54, 74, -40, -4, -40], H1('rgba(255,255,255,0.18)'));
    for (const s of [-1, 1]) {
      line([-46, s * 22, -10, s * 44, 60, s * 46], EC.red, 1.6);
      poly([18, s * 14, 64, s * 16, 70, s * 30, 22, s * 30], H1(EC.a3), EC.ln);  // 装甲スリット
      line([28, s * 22, 62, s * 23], EC.org, 1.2);
    }
    // 中央コア（弱点）
    ctx.fillStyle = H1(EC.a3); ctx.beginPath(); ctx.arc(-20, 0, 24, 0, TAU); ctx.fill();
    ctx.strokeStyle = EC.red; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(-20, 0, 24, 0, TAU); ctx.stroke();
    ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(-20, 0, 18, e.age * 2, e.age * 2 + TAU * 0.7); ctx.stroke();
    glow(-20, 0, 26 + pulse * 6, 'rgba(255,46,99,0.95)');
  }
  ctx.restore();
}
function drawItem(it) {
  ctx.save(); ctx.translate(it.x, it.y);
  const c = it.type === 'P' ? '#ffcc33' : '#4f8';
  ctx.rotate(it.age * 2);
  ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.strokeRect(-12, -12, 24, 24);
  ctx.rotate(-it.age * 2);
  ctx.fillStyle = c; ctx.font = `bold 16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(it.type, 0, 1);
  ctx.restore();
}

/* ---------- Draw: HUD / screens ---------- */
function text(s, x, y, size, col, align = 'center', weight = 'bold') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (state !== 'title' && state !== 'option' && isDay()) { ctx.lineWidth = Math.max(2, size * 0.16); ctx.strokeStyle = 'rgba(5,10,30,0.7)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function drawHUD() {
  text('SCORE ' + String(score).padStart(8, '0'), 20, 24, 18, '#fff', 'left');
  text('HI ' + String(hi).padStart(8, '0'), 20, 48, 14, '#9ab', 'left');
  for (let i = 0; i < P.maxhp; i++) {
    ctx.fillStyle = i < P.hp ? '#4cf' : 'rgba(255,255,255,0.15)';
    ctx.fillRect(250 + i * 22, 16, 16, 16);
  }
  text('LV ' + P.lvl, 370, 24, 16, '#ffcc33', 'left');
  text('STAGE ' + loop, 430, 24, 14, '#f8a', 'left');
  // burst gauge
  const full = P.burst >= 100;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(20, H - 28, 180, 10);
  ctx.fillStyle = full ? (Math.floor(stateT * 6) % 2 ? '#7ff' : '#fff') : '#4cf';
  ctx.fillRect(20, H - 28, 180 * P.burst / 100, 10);
  text(full ? (usedTouch ? 'BURST READY!' : 'BURST READY! [X]') : 'BURST', 20, H - 42, 12, full ? '#7ff' : '#9ab', 'left');
  if (boss) {
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(W / 2 - 200, 60, 400, 8);
    ctx.fillStyle = '#ff3b6b'; ctx.fillRect(W / 2 - 200, 60, 400 * Math.max(0, boss.hp) / boss.maxhp, 8);
    text('GRAND VEAST', W / 2, 48, 12, '#ff9ab0');
  }
  if (usedTouch) {
    // pause
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.arc(pauseBtn.x, pauseBtn.y, pauseBtn.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(pauseBtn.x - 8, pauseBtn.y - 9, 5, 18); ctx.fillRect(pauseBtn.x + 3, pauseBtn.y - 9, 5, 18);
    // burst button
    const b = burstBtn;
    ctx.fillStyle = full ? 'rgba(80,240,255,0.35)' : 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = full ? '#7ff' : 'rgba(120,200,255,0.6)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 3, -Math.PI / 2, -Math.PI / 2 + TAU * P.burst / 100); ctx.stroke();
    text('BURST', b.x, b.y, 15, full ? '#fff' : 'rgba(255,255,255,0.5)');
  }
  if (msg) {
    const a = Math.min(1, msg.t * 2);
    if (!msg.warn || Math.floor(msg.t * 5) % 2) {
      ctx.globalAlpha = a;
      text(msg.text, W / 2, H / 2 - 120, msg.warn ? 54 : 30, msg.warn ? '#ff3b6b' : '#fff');
      ctx.globalAlpha = 1;
    }
  }
}
function drawTitle() {
  ctx.fillStyle = 'rgba(5,6,15,0.45)'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 120, 0, 220);
  g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#7ff'); g.addColorStop(1, '#4a7cff');
  ctx.save(); ctx.shadowColor = '#4cf'; ctx.shadowBlur = 24;
  text('VEAST', W / 2, 150, 104, g, 'center', '900');
  ctx.restore();
  text('S p l e n d o r', W / 2, 228, 40, '#ffcc33', 'center', '600');
  text('ヴィースト・スプレンダー', W / 2, 272, 16, '#9ab', 'center', '500');
  titleBtns.forEach((b, i) => drawButton(b, b.label, titleSel === i));
  text('STAGE ' + startStage + '  ' + STAGES[startStage - 1].name + ' から開始', W / 2, 384, 13, '#9ab', 'center', '500');
  text('スマホ：ドラッグで移動・自動連射・右下ボタンでバースト', W / 2, 410, 15, '#cde', 'center', '500');
  text('PC：矢印 / WASD で移動・自動連射・X でバースト・C 低速・P 一時停止・M 消音', W / 2, 436, 15, '#cde', 'center', '500');
  if (hi > 0) text('HI SCORE ' + hi, W / 2, 480, 16, '#ffcc33');
  if (innerHeight > innerWidth) text('📱 横向きにすると大きな画面で遊べます', W / 2, 30, 16, '#f8a', 'center', '500');
}
function drawButton(b, label, active) {
  const pulse = active ? 0.5 + 0.5 * Math.sin(stateT * 6) : 0;
  ctx.fillStyle = active ? `rgba(70,200,255,${0.25 + pulse * 0.15})` : 'rgba(255,255,255,0.08)';
  ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  ctx.strokeStyle = active ? '#7ff' : 'rgba(200,220,255,0.4)'; ctx.lineWidth = active ? 3 : 1.5;
  ctx.strokeRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  text(label, b.x, b.y + 1, Math.min(26, b.h * 0.5), active ? '#fff' : '#cde', 'center', '900');
}
function drawOption() {
  ctx.fillStyle = 'rgba(5,6,15,0.5)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.shadowColor = '#4cf'; ctx.shadowBlur = 18;
  text('OPTION', W / 2, 90, 56, '#7ff', 'center', '900');
  ctx.restore();
  text('START STAGE  開始ステージ', W / 2, 180, 20, optSel === 0 ? '#ffcc33' : '#9ab', 'center', '700');
  // ステージ表示
  const box = { x: W / 2, y: 260, w: 340, h: 90 };
  ctx.fillStyle = optSel === 0 ? 'rgba(70,200,255,0.2)' : 'rgba(255,255,255,0.08)';
  ctx.fillRect(box.x - box.w / 2, box.y - box.h / 2, box.w, box.h);
  ctx.strokeStyle = optSel === 0 ? '#7ff' : 'rgba(200,220,255,0.4)'; ctx.lineWidth = optSel === 0 ? 3 : 1.5;
  ctx.strokeRect(box.x - box.w / 2, box.y - box.h / 2, box.w, box.h);
  const st = STAGES[startStage - 1];
  text('STAGE ' + startStage, W / 2, 242, 30, '#fff', 'center', '900');
  text(st.name + '  ' + st.jp, W / 2, 280, 17, '#cde', 'center', '600');
  for (const [b, dir] of [[optBtns.prev, -1], [optBtns.next, 1]]) {   // ◀ ▶
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.w / 2, 0, TAU); ctx.fill();
    ctx.fillStyle = optSel === 0 ? '#7ff' : '#9ab';
    poly([b.x + dir * 14, b.y, b.x - dir * 10, b.y - 16, b.x - dir * 10, b.y + 16], ctx.fillStyle);
  }
  for (let i = 1; i <= 3; i++) {                                         // ページ送りの丸
    ctx.fillStyle = i === startStage ? '#7ff' : 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.arc(W / 2 + (i - 2) * 22, 330, 5, 0, TAU); ctx.fill();
  }
  drawButton(optBtns.back, 'BACK', optSel === 1);
  text(usedTouch ? '◀ ▶ をタップで変更' : '← → で変更 / ↑ ↓ で選択 / Enter・Esc で戻る', W / 2, 495, 14, '#9ab', 'center', '500');
}
function drawOverlay(title, sub, col) {
  ctx.fillStyle = 'rgba(5,6,15,0.6)'; ctx.fillRect(0, 0, W, H);
  text(title, W / 2, H / 2 - 50, 60, col, 'center', '900');
  text('SCORE ' + score, W / 2, H / 2 + 15, 26, '#fff');
  text('HI ' + hi, W / 2, H / 2 + 50, 18, '#ffcc33');
  if (stateT > 0.7 && Math.floor(stateT * 2) % 2 === 0) text(sub, W / 2, H / 2 + 110, 20, '#cde');
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 10, rand(-1, 1) * shake * 10);
  drawBG();
  if (state !== 'title' && state !== 'option') {
    for (const it of items) drawItem(it);
    for (const e of enemies) drawEnemy(e);
    drawPlayer();
    ctx.fillStyle = 'rgba(0,30,60,0.6)';
    for (const b of pb) { ctx.fillRect(b.x - 11, b.y - 3, 22, 6); }
    ctx.fillStyle = '#9ff';
    for (const b of pb) { ctx.fillRect(b.x - 10, b.y - 2, 20, 4); }
    for (const b of eb) {
      ctx.fillStyle = '#5a0020'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3.5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff3b6b'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 1.5, 0, TAU); ctx.fill();
    }
  }
  for (const p of parts) {
    const a = Math.max(0, p.life / p.max);
    if (p.ring) {
      ctx.strokeStyle = p.c; ctx.globalAlpha = a; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - a) + 4, 0, TAU); ctx.stroke();
    } else { ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(200,255,255,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'title') drawTitle();
  else if (state === 'option') drawOption();
  else {
    drawHUD();
    if (state === 'over') {
      drawOverlay('GAME OVER', '', '#ff3b6b');
      if (stateT > 1) {
        overBtns.forEach((b, i) => drawButton(b, b.label, overSel === i));
        text('STAGE ' + loop + ' からやり直し（スコアは 0 から）', overBtns[0].x, 452, 12, '#9ab', 'center', '500');
      }
    }
    else if (state === 'clear') drawOverlay('MISSION CLEAR', 'TAP / ENTER で次のステージへ', '#7ff');
    else if (paused) {
      ctx.fillStyle = 'rgba(5,6,15,0.55)'; ctx.fillRect(0, 0, W, H);
      text('PAUSE', W / 2, H / 2 - 10, 48, '#fff', 'center', '900');
      text(usedTouch ? 'タップで再開' : 'P キーで再開', W / 2, H / 2 + 40, 18, '#cde');
    }
  }
  if (muted) text('MUTE', W - 80, H - 14, 12, '#9ab');
}

/* ---------- Main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); updateMusic(); draw();
  requestAnimationFrame(frame);
}
resetField();
P = { x: 150, y: H / 2, vy: 0, thrust: 0, upT: 0, hp: 5, maxhp: 5, inv: 0, lvl: 1, fire: 0, burst: 0 };
score = 0;
requestAnimationFrame(frame);
</script>
</body>
</html>
