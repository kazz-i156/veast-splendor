<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>VEAST Splendor</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* =========================================================
   VEAST Splendor  — single-file side-scrolling shooter
   ========================================================= */
const W = 960, H = 540;
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const TAU = Math.PI * 2;
const BOSS_TIME = 80;            // 秒：ボス出現タイミング
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

/* ---------- Canvas / resize ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

/* ---------- Audio (WebAudio, 素材ファイル不要) ---------- */
let ac = null, muted = false, noiseBuf = null, lastExp = 0;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function tone(f, dur, type, vol, slide) {
  if (!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + dur);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  o.connect(g).connect(ac.destination); o.start(n); o.stop(n + dur);
}
function noise(dur, vol, freq) {
  if (!ac || muted) return;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), n = ac.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq || 1200;
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(n); s.stop(n + dur);
}
function sfx(k) {
  if (k === 'exp') { const n = performance.now(); if (n - lastExp < 45) return; lastExp = n; noise(0.35, 0.25, 900); }
  else if (k === 'big') { noise(1.2, 0.5, 600); tone(90, 1.0, 'sawtooth', 0.15, 30); }
  else if (k === 'hit') { tone(220, 0.35, 'sawtooth', 0.2, 50); noise(0.3, 0.3, 2000); }
  else if (k === 'item') { tone(660, 0.12, 'square', 0.08, 1320); setTimeout(() => tone(990, 0.15, 'square', 0.08, 1760), 80); }
  else if (k === 'burst') { noise(0.9, 0.5, 3000); tone(120, 0.9, 'sawtooth', 0.2, 900); }
  else if (k === 'warn') { tone(440, 0.25, 'square', 0.1); setTimeout(() => tone(440, 0.25, 'square', 0.1), 400); }
  else if (k === 'start') { tone(440, 0.1, 'square', 0.08, 880); setTimeout(() => tone(880, 0.25, 'square', 0.08, 1760), 100); }
}

/* ---------- State ---------- */
let state = 'title', stateT = 0, paused = false, usedTouch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
let P, pb, eb, enemies, parts, items, t, spawnT, score, boss, bossSpawned, loop = 1, flash, shake, msg, clearT;
let hi = 0;
try { hi = +localStorage.getItem('veast_hi') || 0; } catch (e) {}
function saveHi() { if (score > hi) { hi = score; try { localStorage.setItem('veast_hi', hi); } catch (e) {} } }

function resetField() {
  pb = []; eb = []; enemies = []; parts = []; items = [];
  t = 0; spawnT = 1.5; boss = null; bossSpawned = false; flash = 0; shake = 0; msg = null; clearT = 0;
}
function startGame() {
  loop = 1; score = 0; resetField();
  P = { x: 150, y: H / 2, hp: 5, maxhp: 5, inv: 2, lvl: 1, fire: 0, burst: 0 };
  setState('play'); msg = { text: 'MISSION START', t: 2 }; sfx('start');
}
function nextLoop() {
  loop++; resetField();
  P.x = 150; P.y = H / 2; P.hp = P.maxhp; P.inv = 2;
  setState('play'); msg = { text: 'LOOP ' + loop, t: 2 }; sfx('start');
}
function setState(s) { state = s; stateT = 0; paused = false; }
const diff = () => (1 + t / 70) * (1 + (loop - 1) * 0.35);

/* ---------- Input ---------- */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  initAudio();
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'play') {
    if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
    else if (e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') triggerBurst();
  } else if (['Enter', 'Space', 'KeyZ'].includes(e.code)) advance();
});
addEventListener('keyup', e => { keys[e.code] = false; });
// LINE などのアプリ内ブラウザ(WebView)は、画面タップのたびに window の blur を発火することがある。
// そのためタッチ操作中は blur でポーズせず、本当に画面が隠れたとき(visibilitychange / pagehide)だけポーズする。
const autoPause = () => { if (state === 'play') paused = true; };
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (!usedTouch) autoPause();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
addEventListener('pagehide', autoPause);
addEventListener('contextmenu', e => e.preventDefault());

const burstBtn = { x: W - 82, y: H - 82, r: 50 };
const pauseBtn = { x: W - 40, y: 40, r: 26 };
let drag = null;
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
addEventListener('pointerdown', e => {
  initAudio();
  if (e.pointerType === 'touch') usedTouch = true;
  const p = toLogical(e);
  if (state !== 'play') { advance(); return; }
  if (paused) { paused = false; return; }
  if (usedTouch && dist2(p, pauseBtn) < (pauseBtn.r + 14) ** 2) { paused = true; return; }
  if (usedTouch && dist2(p, burstBtn) < (burstBtn.r + 14) ** 2) { triggerBurst(); return; }
  if (!drag) drag = { id: e.pointerId, x: p.x, y: p.y };
}, { passive: false });
addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || state !== 'play' || paused) return;
  const p = toLogical(e);
  P.x += (p.x - drag.x) * 1.3; P.y += (p.y - drag.y) * 1.3;
  drag.x = p.x; drag.y = p.y;
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

function advance() {
  if (stateT < 0.7) return;
  if (state === 'title' || state === 'over') startGame();
  else if (state === 'clear') nextLoop();
}

/* ---------- Spawning ---------- */
function spawnDroneGroup() {
  const by = rand(80, H - 80), n = 4 + Math.floor(Math.random() * 3), amp = rand(30, 90);
  for (let i = 0; i < n; i++)
    enemies.push({ type: 'drone', x: W + 30 + i * 46, y: by, by, amp, ph: i * 0.6, vx: -rand(170, 210),
      hp: 2, r: 16, score: 100, age: 0, flash: 0 });
}
function spawnGunner() {
  const y = rand(70, H - 70);
  enemies.push({ type: 'gunner', x: W + 40, y, tx: rand(620, 820), hp: 7, r: 22, score: 300, age: 0, flash: 0, cd: 1 });
}
function spawnHeavy() {
  enemies.push({ type: 'heavy', x: W + 60, y: rand(110, H - 110), vx: -55, hp: 24, r: 34, score: 800, age: 0, flash: 0, cd: 1.5 });
}
function spawnBoss() {
  bossSpawned = true;
  const hp = Math.round(420 * (1 + (loop - 1) * 0.5));
  boss = { type: 'boss', x: W + 160, y: H / 2, r: 60, hp, maxhp: hp, score: 20000, age: 0, flash: 0,
    phase: 0, pt: 0, cd: 0, ang: 0 };
  enemies.push(boss); msg = { text: 'WARNING', t: 3, warn: true }; sfx('warn');
}
function spawnLogic(dt) {
  if (bossSpawned) return;
  if (t >= BOSS_TIME) { if (enemies.length === 0 || t > BOSS_TIME + 5) spawnBoss(); return; }
  spawnT -= dt;
  if (spawnT <= 0) {
    const r = Math.random(), d = diff();
    if (t > 20 && r < 0.1 * d) spawnHeavy();
    else if (t > 8 && r < 0.42) spawnGunner();
    else spawnDroneGroup();
    spawnT = rand(1.2, 2.1) / d;
  }
}

/* ---------- Shots ---------- */
function eShot(x, y, vx, vy, big) { eb.push({ x, y, vx, vy, r: big ? 8 : 5 }); }
function aimShot(x, y, sp, off = 0) {
  const a = Math.atan2(P.y - y, P.x - x) + off;
  eShot(x, y, Math.cos(a) * sp, Math.sin(a) * sp);
}
function fan(x, y, n, spread, sp) {
  for (let i = 0; i < n; i++) aimShot(x, y, sp, n === 1 ? 0 : -spread / 2 + spread * i / (n - 1));
}
function playerFire() {
  const x = P.x + 42, y = P.y + 1, s = 900;
  const add = (dy, a) => pb.push({ x, y: y + dy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 6 });
  if (P.lvl === 1) add(0, 0);
  else if (P.lvl === 2) { add(-6, 0); add(6, 0); }
  else { add(-6, 0); add(6, 0); add(0, -0.13); add(0, 0.13); }
}

/* ---------- Damage / effects ---------- */
function explode(x, y, size, col) {
  const n = Math.round(10 * size);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(60, 260) * size;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7,
      size: rand(2, 4) * Math.sqrt(size), c: col || (Math.random() < 0.5 ? '#ffcc33' : '#ff6a3d') });
  }
  parts.push({ ring: true, x, y, life: 0.4, max: 0.4, size: 30 * size, c: '#fff' });
}
function damage(e, d) {
  if (e.dead) return;
  e.hp -= d; e.flash = 0.06;
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  e.dead = true; score += e.score * loop;
  const charge = { drone: 3, gunner: 7, heavy: 14, boss: 0 }[e.type];
  P.burst = Math.min(100, P.burst + charge);
  if (e.type === 'boss') {
    boss = null; clearT = 3.2; eb.length = 0;
    for (let i = 0; i < 12; i++) setTimeout(() => { if (state === 'play') { explode(e.x + rand(-60, 60), e.y + rand(-60, 60), 1.6); sfx('exp'); } }, i * 120);
    explode(e.x, e.y, 3, '#fff'); sfx('big'); shake = 1; flash = 0.8;
    return;
  }
  explode(e.x, e.y, e.type === 'heavy' ? 2 : e.type === 'gunner' ? 1.3 : 0.9);
  sfx(e.type === 'heavy' ? 'big' : 'exp');
  if (e.type === 'heavy') shake = Math.max(shake, 0.3);
  const r = Math.random();
  if (e.type === 'heavy' || r < 0.05) items.push({ type: 'P', x: e.x, y: e.y, age: 0 });
  else if (r < 0.08) items.push({ type: 'H', x: e.x, y: e.y, age: 0 });
}
function hurtPlayer() {
  if (P.inv > 0 || clearT > 0) return;
  P.hp--; P.inv = 2; P.lvl = Math.max(1, P.lvl - 1);
  explode(P.x, P.y, 1.2, '#4cf'); sfx('hit'); shake = 0.5; flash = 0.3;
  if (P.hp <= 0) { explode(P.x, P.y, 3, '#4cf'); sfx('big'); saveHi(); setState('over'); }
}
function triggerBurst() {
  if (state !== 'play' || paused || P.burst < 100) return;
  P.burst = 0; flash = 1; shake = 0.6; P.inv = Math.max(P.inv, 1.2);
  for (const b of eb) parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.3, max: 0.3, size: 5, c: '#9ff' });
  eb.length = 0;
  for (const e of enemies) damage(e, e.type === 'boss' ? 50 : 30);
  parts.push({ ring: true, x: P.x, y: P.y, life: 0.7, max: 0.7, size: 700, c: '#7ff' });
  sfx('burst');
}

/* ---------- Update ---------- */
function updEnemy(e, dt) {
  e.age += dt; e.flash = Math.max(0, e.flash - dt);
  const d = diff();
  switch (e.type) {
    case 'drone':
      e.x += e.vx * dt; e.y = e.by + Math.sin(e.age * 3 + e.ph) * e.amp;
      if (d > 1.5 && e.x < W - 40 && Math.random() < dt * 0.12 * d) aimShot(e.x, e.y, 210);
      break;
    case 'gunner':
      if (e.age < 7) e.x += (e.tx - e.x) * Math.min(1, dt * 2.5);
      else e.x += 240 * dt;
      e.cd -= dt;
      if (e.age > 1 && e.age < 7 && e.cd <= 0) { fan(e.x - 20, e.y, d > 1.8 ? 3 : 1, 0.35, 240); e.cd = 1.5 / d; }
      break;
    case 'heavy':
      e.x += e.vx * dt; e.y += Math.sin(e.age * 1.2) * 30 * dt;
      e.cd -= dt;
      if (e.cd <= 0 && e.x < W - 40) { fan(e.x - 30, e.y, 5, 1.0, 170); e.cd = 2.3 / d; }
      break;
    case 'boss': updBoss(e, dt); break;
  }
}
function updBoss(e, dt) {
  if (e.age < 2.8) { e.x += (760 - e.x) * dt * 1.4; return; }
  const k = e.age - 2.8;
  e.y = H / 2 + Math.sin(k * 0.7) * 150;
  e.x = 760 + Math.sin(k * 0.45) * 50;
  e.pt += dt;
  if (e.pt > 6) { e.pt = 0; e.phase = (e.phase + 1) % 3; e.cd = 0.8; }
  const rage = (e.hp < e.maxhp * 0.5 ? 1.4 : 1) * (1 + (loop - 1) * 0.2);
  e.cd -= dt;
  if (e.cd > 0) return;
  if (e.phase === 0) { fan(e.x - 50, e.y, rage > 1.2 ? 7 : 5, 0.7, 250); e.cd = 0.95 / rage; }
  else if (e.phase === 1) {
    e.ang += 0.41;
    for (let i = 0; i < 3; i++) { const a = e.ang + i * TAU / 3; eShot(e.x - 20, e.y, Math.cos(a) * 165, Math.sin(a) * 165); }
    e.cd = 0.12 / rage;
  } else {
    aimShot(e.x - 60, e.y - 42, 330); aimShot(e.x - 60, e.y + 42, 330); e.cd = 0.24 / rage;
  }
}

function update(dt) {
  stateT += dt;
  updateBG(dt);
  for (const p of parts) { p.life -= dt; if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; } }
  parts = parts.filter(p => p.life > 0);
  flash = Math.max(0, flash - dt * 2); shake = Math.max(0, shake - dt);
  if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
  if (state !== 'play' || paused) return;

  t += dt;
  // player
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.KeyA) mx--;
  if (keys.ArrowRight || keys.KeyD) mx++;
  if (keys.ArrowUp || keys.KeyW) my--;
  if (keys.ArrowDown || keys.KeyS) my++;
  if (mx && my) { mx *= 0.7071; my *= 0.7071; }
  const sp = keys.KeyC ? 170 : 340; // Cキーで低速移動
  P.x = clamp(P.x + mx * sp * dt, 30, W - 70);
  P.y = clamp(P.y + my * sp * dt, 34, H - 30);
  P.inv = Math.max(0, P.inv - dt);
  P.fire -= dt;
  if (P.fire <= 0 && clearT <= 0) { playerFire(); P.fire = 0.085; }

  spawnLogic(dt);

  for (const b of pb) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const b of eb) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const e of enemies) updEnemy(e, dt);
  for (const it of items) { it.age += dt; it.x -= 80 * dt; it.y += Math.sin(it.age * 3) * 40 * dt; }

  // player bullets vs enemies
  for (const b of pb) {
    for (const e of enemies) {
      if (e.dead || e.x > W + 20) continue;
      if (dist2(b, e) < (b.r + e.r) ** 2) { damage(e, 1); b.dead = true; parts.push({ x: b.x, y: b.y, vx: rand(-80, 0), vy: rand(-60, 60), life: 0.15, max: 0.15, size: 3, c: '#fff' }); break; }
    }
  }
  // enemy bullets vs player (当たり判定は胸の小さなコアのみ)
  for (const b of eb) if (dist2(b, P) < (b.r + 5) ** 2) { b.dead = true; hurtPlayer(); }
  for (const e of enemies) if (!e.dead && dist2(e, P) < (e.r * 0.8 + 8) ** 2) { hurtPlayer(); if (e.type !== 'boss') damage(e, 5); }
  for (const it of items) if (dist2(it, P) < 30 * 30) {
    it.dead = true; sfx('item');
    if (it.type === 'P') { if (P.lvl < 3) P.lvl++; else score += 1000 * loop; msg = { text: P.lvl < 3 ? 'POWER UP' : 'MAX POWER', t: 1 }; }
    else { P.hp = Math.min(P.maxhp, P.hp + 1); msg = { text: 'REPAIR', t: 1 }; }
  }

  pb = pb.filter(b => !b.dead && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  eb = eb.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  enemies = enemies.filter(e => !e.dead && e.x > -100 && !(e.x > W + 120 && e.age > 3));
  items = items.filter(it => !it.dead && it.x > -20);

  if (clearT > 0) { clearT -= dt; if (clearT <= 0) { saveHi(); setState('clear'); } }
  if (state === 'play' && score > hi) hi = score;
}

/* ---------- Background ---------- */
const stars = [];
for (let i = 0; i < 110; i++) stars.push({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1) });
function makeCity(n, minH, maxH) {
  const a = []; let x = 0;
  while (x < W + 200) { const w = rand(30, 80); a.push({ x, w, h: rand(minH, maxH), lit: Math.random() }); x += w + rand(0, 10); }
  return { b: a, off: 0, len: x };
}
const cityFar = makeCity(0, 60, 160), cityNear = makeCity(0, 30, 100);
function updateBG(dt) {
  const v = state === 'play' && !paused ? 1 : 0.4;
  for (const s of stars) { s.x -= s.z * 120 * dt * v; if (s.x < 0) { s.x += W; s.y = rand(0, H); } }
  cityFar.off = (cityFar.off + 25 * dt * v) % cityFar.len;
  cityNear.off = (cityNear.off + 60 * dt * v) % cityNear.len;
}
function drawCity(c, col, winCol) {
  ctx.fillStyle = col;
  for (let k = 0; k < 2; k++) for (const b of c.b) {
    const x = b.x - c.off + k * c.len;
    if (x > W || x + b.w < 0) continue;
    ctx.fillRect(x, H - b.h, b.w, b.h);
    if (winCol && b.lit > 0.4) {
      ctx.fillStyle = winCol;
      for (let wy = H - b.h + 10; wy < H - 8; wy += 14) for (let wx = x + 6; wx < x + b.w - 6; wx += 12)
        if (((wx * 7 + wy * 13) | 0) % 5 === 0) ctx.fillRect(wx, wy, 4, 5);
      ctx.fillStyle = col;
    }
  }
}
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05060f'); g.addColorStop(0.65, '#14123a'); g.addColorStop(1, '#3a1a4a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.fillStyle = `rgba(200,220,255,${s.z})`; ctx.fillRect(s.x, s.y, s.z * 2.4, s.z * 2.4); }
  drawCity(cityFar, '#1b1840', 'rgba(255,200,120,0.25)');
  drawCity(cityNear, '#0c0b22', 'rgba(120,220,255,0.35)');
}

/* ---------- Draw: entities ---------- */
function poly(pts, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function drawPlayer() {
  if (state === 'over') return;
  ctx.save(); ctx.translate(P.x, P.y); ctx.scale(1.25, 1.25);
  if (P.inv > 0 && Math.floor(P.inv * 20) % 2) ctx.globalAlpha = 0.35;
  const f = 10 + Math.random() * 12;
  poly([-24, -7, -24 - f, 0, -24, 7], '#4cf');
  poly([-24, -4, -24 - f * 0.55, 0, -24, 4], '#fff');
  ctx.fillStyle = '#2a3350'; ctx.fillRect(-26, -13, 11, 24);                 // バックパック
  poly([-10, 7, -1, 7, -6, 23, -18, 23], '#8a94b8');                          // 脚
  poly([-18, 21, -4, 21, 2, 26, -18, 26], '#5a6488');
  poly([-17, -11, 9, -13, 13, 4, -13, 10], '#d8deef');                         // 胴
  poly([-4, -9, 8, -10, 9, -2, -3, -1], '#e8344e');                            // 胸アーマー
  ctx.fillStyle = '#d8deef'; ctx.fillRect(-3, -25, 15, 12);                  // 頭
  ctx.fillStyle = '#3ff'; ctx.fillRect(5, -22, 8, 4);                        // バイザー
  ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 2.5; ctx.beginPath();          // V字アンテナ
  ctx.moveTo(-6, -34); ctx.lineTo(3, -25); ctx.lineTo(13, -34); ctx.stroke();
  ctx.fillStyle = '#5a6488'; ctx.fillRect(3, -3, 28, 8);                     // 腕キャノン
  ctx.fillStyle = '#ffcc33'; ctx.fillRect(31, -2, 4, 6);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill(); // 当たり判定コア
  ctx.restore();
}
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const hit = e.flash > 0;
  if (e.type === 'drone') {
    ctx.rotate(Math.sin(e.age * 6) * 0.15);
    poly([-16, 0, 4, -13, 16, 0, 4, 13], hit ? '#fff' : '#b03060');
    poly([-6, 0, 3, -6, 9, 0, 3, 6], hit ? '#fff' : '#ffb347');
  } else if (e.type === 'gunner') {
    poly([-22, -8, 0, -20, 22, -14, 22, 14, 0, 20, -22, 8], hit ? '#fff' : '#6b3fa0');
    ctx.fillStyle = hit ? '#fff' : '#3b2060'; ctx.fillRect(-34, -4, 16, 8);
    ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(4, 0, 6, 0, TAU); ctx.fill();
  } else if (e.type === 'heavy') {
    poly([-34, -16, -12, -32, 26, -26, 34, 0, 26, 26, -12, 32, -34, 16], hit ? '#fff' : '#704030');
    poly([-20, -10, 10, -16, 18, 0, 10, 16, -20, 10], hit ? '#fff' : '#a0603a');
    ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(-2, 0, 8 + Math.sin(e.age * 8) * 2, 0, TAU); ctx.fill();
  } else if (e.type === 'boss') {
    const c1 = hit ? '#fff' : '#3a2a5a', c2 = hit ? '#fff' : '#5a3a8a', c3 = hit ? '#fff' : '#20183a';
    poly([-90, -42, -40, -70, 60, -80, 100, -40, 100, 40, 60, 80, -40, 70, -90, 42], c1);
    poly([-60, -30, -10, -50, 70, -50, 80, 0, 70, 50, -10, 50, -60, 30], c2);
    ctx.fillStyle = c3; ctx.fillRect(-110, -50, 60, 16); ctx.fillRect(-110, 34, 60, 16);  // キャノン
    poly([40, -80, 70, -110, 90, -78], c2); poly([40, 80, 70, 110, 90, 78], c2);           // 角
    const pulse = 14 + Math.sin(e.age * 6) * 4;
    const g = ctx.createRadialGradient(-20, 0, 2, -20, 0, pulse * 1.8);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ff3b6b'); g.addColorStop(1, 'rgba(255,59,107,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-20, 0, pulse * 1.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawItem(it) {
  ctx.save(); ctx.translate(it.x, it.y);
  const c = it.type === 'P' ? '#ffcc33' : '#4f8';
  ctx.rotate(it.age * 2);
  ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.strokeRect(-12, -12, 24, 24);
  ctx.rotate(-it.age * 2);
  ctx.fillStyle = c; ctx.font = `bold 16px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(it.type, 0, 1);
  ctx.restore();
}

/* ---------- Draw: HUD / screens ---------- */
function text(s, x, y, size, col, align = 'center', weight = 'bold') {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function drawHUD() {
  text('SCORE ' + String(score).padStart(8, '0'), 20, 24, 18, '#fff', 'left');
  text('HI ' + String(hi).padStart(8, '0'), 20, 48, 14, '#9ab', 'left');
  for (let i = 0; i < P.maxhp; i++) {
    ctx.fillStyle = i < P.hp ? '#4cf' : 'rgba(255,255,255,0.15)';
    ctx.fillRect(250 + i * 22, 16, 16, 16);
  }
  text('LV ' + P.lvl, 370, 24, 16, '#ffcc33', 'left');
  if (loop > 1) text('LOOP ' + loop, 430, 24, 14, '#f8a', 'left');
  // burst gauge
  const full = P.burst >= 100;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(20, H - 28, 180, 10);
  ctx.fillStyle = full ? (Math.floor(stateT * 6) % 2 ? '#7ff' : '#fff') : '#4cf';
  ctx.fillRect(20, H - 28, 180 * P.burst / 100, 10);
  text(full ? (usedTouch ? 'BURST READY!' : 'BURST READY! [X]') : 'BURST', 20, H - 42, 12, full ? '#7ff' : '#9ab', 'left');
  if (boss) {
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(W / 2 - 200, 60, 400, 8);
    ctx.fillStyle = '#ff3b6b'; ctx.fillRect(W / 2 - 200, 60, 400 * Math.max(0, boss.hp) / boss.maxhp, 8);
    text('GRAND VEAST', W / 2, 48, 12, '#ff9ab0');
  }
  if (usedTouch) {
    // pause
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.arc(pauseBtn.x, pauseBtn.y, pauseBtn.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(pauseBtn.x - 8, pauseBtn.y - 9, 5, 18); ctx.fillRect(pauseBtn.x + 3, pauseBtn.y - 9, 5, 18);
    // burst button
    const b = burstBtn;
    ctx.fillStyle = full ? 'rgba(80,240,255,0.35)' : 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = full ? '#7ff' : 'rgba(120,200,255,0.6)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 3, -Math.PI / 2, -Math.PI / 2 + TAU * P.burst / 100); ctx.stroke();
    text('BURST', b.x, b.y, 15, full ? '#fff' : 'rgba(255,255,255,0.5)');
  }
  if (msg) {
    const a = Math.min(1, msg.t * 2);
    if (!msg.warn || Math.floor(msg.t * 5) % 2) {
      ctx.globalAlpha = a;
      text(msg.text, W / 2, H / 2 - 120, msg.warn ? 54 : 30, msg.warn ? '#ff3b6b' : '#fff');
      ctx.globalAlpha = 1;
    }
  }
}
function drawTitle() {
  ctx.fillStyle = 'rgba(5,6,15,0.45)'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 120, 0, 220);
  g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#7ff'); g.addColorStop(1, '#4a7cff');
  ctx.save(); ctx.shadowColor = '#4cf'; ctx.shadowBlur = 24;
  text('VEAST', W / 2, 150, 104, g, 'center', '900');
  ctx.restore();
  text('S p l e n d o r', W / 2, 228, 40, '#ffcc33', 'center', '600');
  text('ヴィースト・スプレンダー', W / 2, 272, 16, '#9ab', 'center', '500');
  if (Math.floor(stateT * 2) % 2 === 0) text(usedTouch ? 'TAP TO START' : 'TAP / PRESS ENTER', W / 2, 345, 24, '#fff');
  text('スマホ：ドラッグで移動・自動連射・右下ボタンでバースト', W / 2, 410, 15, '#cde', 'center', '500');
  text('PC：矢印 / WASD で移動・自動連射・X でバースト・C 低速・P 一時停止・M 消音', W / 2, 436, 15, '#cde', 'center', '500');
  if (hi > 0) text('HI SCORE ' + hi, W / 2, 480, 16, '#ffcc33');
  if (innerHeight > innerWidth) text('📱 横向きにすると大きな画面で遊べます', W / 2, 30, 16, '#f8a', 'center', '500');
}
function drawOverlay(title, sub, col) {
  ctx.fillStyle = 'rgba(5,6,15,0.6)'; ctx.fillRect(0, 0, W, H);
  text(title, W / 2, H / 2 - 50, 60, col, 'center', '900');
  text('SCORE ' + score, W / 2, H / 2 + 15, 26, '#fff');
  text('HI ' + hi, W / 2, H / 2 + 50, 18, '#ffcc33');
  if (stateT > 0.7 && Math.floor(stateT * 2) % 2 === 0) text(sub, W / 2, H / 2 + 110, 20, '#cde');
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 10, rand(-1, 1) * shake * 10);
  drawBG();
  if (state !== 'title') {
    for (const it of items) drawItem(it);
    for (const e of enemies) drawEnemy(e);
    drawPlayer();
    ctx.fillStyle = '#9ff';
    for (const b of pb) { ctx.fillRect(b.x - 10, b.y - 2, 20, 4); }
    for (const b of eb) {
      ctx.fillStyle = '#ff3b6b'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 1.5, 0, TAU); ctx.fill();
    }
  }
  for (const p of parts) {
    const a = Math.max(0, p.life / p.max);
    if (p.ring) {
      ctx.strokeStyle = p.c; ctx.globalAlpha = a; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - a) + 4, 0, TAU); ctx.stroke();
    } else { ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(200,255,255,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'title') drawTitle();
  else {
    drawHUD();
    if (state === 'over') drawOverlay('GAME OVER', 'TAP / ENTER でリトライ', '#ff3b6b');
    else if (state === 'clear') drawOverlay('MISSION CLEAR', 'TAP / ENTER で次のループへ', '#7ff');
    else if (paused) {
      ctx.fillStyle = 'rgba(5,6,15,0.55)'; ctx.fillRect(0, 0, W, H);
      text('PAUSE', W / 2, H / 2 - 10, 48, '#fff', 'center', '900');
      text(usedTouch ? 'タップで再開' : 'P キーで再開', W / 2, H / 2 + 40, 18, '#cde');
    }
  }
  if (muted) text('MUTE', W - 80, H - 14, 12, '#9ab');
}

/* ---------- Main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
resetField();
P = { x: 150, y: H / 2, hp: 5, maxhp: 5, inv: 0, lvl: 1, fire: 0, burst: 0 };
score = 0;
requestAnimationFrame(frame);
</script>
</body>
